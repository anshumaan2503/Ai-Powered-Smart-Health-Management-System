services:
  - type: web
    name: hospital-management-frontend
    env: node
    dir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://hospital-management-backend.onrender.com/api
      - key: NODE_ENV
        value: production

  - type: web
    name: hospital-management-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_CONFIG
        value: production
      - key: DATABASE_URL
        value: sqlite:///hospital.db

